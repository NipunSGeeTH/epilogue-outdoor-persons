<!DOCTYPE html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Epilogue 26 — Guest Pass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg0: #0c1220;
        --bg1: #141c2e;
        --ink: #f4efe6;
        --muted: #a8b0c2;
        --line: rgba(244, 239, 230, 0.14);
        --accent: #e8a54b;
        --accent-ink: #1a1208;
        --danger: #ff7b7b;
        --sheet: rgba(20, 28, 46, 0.92);
        --radius: 16px;
        --font-display: "Bebas Neue", sans-serif;
        --font-body: "DM Sans", system-ui, sans-serif;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font-body);
        color: var(--ink);
        background:
          radial-gradient(ellipse 120% 80% at 10% -10%, rgba(232, 165, 75, 0.22), transparent 55%),
          radial-gradient(ellipse 90% 60% at 100% 0%, rgba(90, 140, 255, 0.16), transparent 50%),
          linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #0a0f18);
      }
      .page {
        width: min(100%, 440px);
        margin: 0 auto;
        padding: 1.25rem 1rem 2.5rem;
      }
      .hero {
        padding: 1.75rem 0.25rem 1.5rem;
        text-align: center;
      }
      .hero__eyebrow {
        margin: 0 0 0.35rem;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }
      .hero__brand {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(3.4rem, 16vw, 4.6rem);
        line-height: 0.9;
        letter-spacing: 0.04em;
        font-weight: 400;
      }
      .hero__tag {
        margin: 0.85rem auto 0;
        max-width: 22rem;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.45;
      }
      .sheet {
        background: var(--sheet);
        border: 1px solid var(--line);
        border-radius: calc(var(--radius) + 4px);
        box-shadow: var(--shadow);
        padding: 1.15rem 1rem 1.25rem;
      }
      .block {
        margin-bottom: 1.4rem;
      }
      .block__head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .block__title {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
      }
      .block__hint {
        margin: 0.25rem 0 0.9rem;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.4;
      }
      .count-pill {
        flex-shrink: 0;
        margin-top: 0.15rem;
        padding: 0.28rem 0.55rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 600;
      }
      .field {
        display: block;
        margin-bottom: 0.75rem;
      }
      .field__label {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--muted);
      }
      input {
        width: 100%;
        appearance: none;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(8, 12, 22, 0.55);
        color: var(--ink);
        font: inherit;
        font-size: 1rem;
        padding: 0.85rem 0.9rem;
        outline: none;
      }
      input::placeholder {
        color: rgba(168, 176, 194, 0.55);
      }
      input:focus {
        border-color: rgba(232, 165, 75, 0.65);
        box-shadow: 0 0 0 3px rgba(232, 165, 75, 0.18);
      }
      .guests {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }
      .guest {
        padding: 0.85rem 0.85rem 0.35rem;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
      }
      .guest__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.55rem;
      }
      .guest__label {
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .icon-btn {
        width: 2rem;
        height: 2rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font-size: 1.25rem;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
      }
      .icon-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .btn {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        border: none;
        border-radius: 14px;
        font: inherit;
        font-weight: 700;
        font-size: 1rem;
        padding: 0.95rem 1rem;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .btn--primary {
        background: var(--accent);
        color: var(--accent-ink);
        margin-top: 0.35rem;
      }
      .btn--ghost {
        background: transparent;
        color: var(--ink);
        border: 1px dashed var(--line);
        font-weight: 600;
      }
      .btn--ghost:disabled {
        display: none;
      }
      .btn__icon {
        display: inline-grid;
        place-items: center;
        width: 1.35rem;
        height: 1.35rem;
        border-radius: 8px;
        background: rgba(232, 165, 75, 0.18);
        color: var(--accent);
        font-size: 1.15rem;
        line-height: 1;
      }
      .form-msg {
        margin: 0 0 0.85rem;
        padding: 0.75rem 0.85rem;
        border-radius: 12px;
        font-size: 0.9rem;
        line-height: 1.4;
      }
      .form-msg--error {
        background: rgba(255, 123, 123, 0.12);
        border: 1px solid rgba(255, 123, 123, 0.35);
        color: #ffc9c9;
      }
      .form-msg--success {
        background: rgba(109, 204, 168, 0.12);
        border: 1px solid rgba(109, 204, 168, 0.35);
        color: #b8f0d8;
      }
      .foot {
        text-align: center;
        padding: 1.25rem 0.5rem 0;
        color: rgba(168, 176, 194, 0.7);
        font-size: 0.78rem;
      }
      .foot p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="hero__eyebrow">University concert</p>
        <h1 class="hero__brand">Epilogue&nbsp;26</h1>
        <p class="hero__tag">Organising committee — record outside guests for a student</p>
      </header>

      <main class="sheet">
        <form id="guest-form" novalidate>
          <section class="block">
            <h2 class="block__title">Student</h2>
            <p class="block__hint">The student is responsible for every guest listed below.</p>
            <label class="field">
              <span class="field__label">Student index number</span>
              <input id="student-index" type="text" placeholder="e.g. 21CSE1234" required />
            </label>
          </section>

          <section class="block">
            <div class="block__head">
              <div>
                <h2 class="block__title">Outside guests</h2>
                <p class="block__hint">Name + NIC only · max 10 per student</p>
              </div>
              <span id="guest-count" class="count-pill">1 / 10</span>
            </div>
            <div id="guests-list" class="guests"></div>
            <button type="button" id="add-guest" class="btn btn--ghost">
              <span class="btn__icon">+</span>
              Add another guest
            </button>
          </section>

          <p id="form-error" class="form-msg form-msg--error" hidden></p>
          <p id="form-success" class="form-msg form-msg--success" hidden></p>

          <button type="submit" id="submit-btn" class="btn btn--primary">Save guest list</button>
        </form>
      </main>

      <footer class="foot">
        <p>One student · up to 10 guests · Epilogue 26</p>
      </footer>
    </div>

    <template id="guest-row-template">
      <div class="guest" data-guest>
        <div class="guest__top">
          <span class="guest__label">Guest <span data-guest-num></span></span>
          <button type="button" class="icon-btn" data-remove aria-label="Remove guest">×</button>
        </div>
        <label class="field">
          <span class="field__label">Full name</span>
          <input type="text" data-guest-name placeholder="Guest full name" required />
        </label>
        <label class="field">
          <span class="field__label">NIC number</span>
          <input type="text" data-guest-nic placeholder="e.g. 199912345678 or 991234567V" required />
        </label>
      </div>
    </template>

    <script>
      (function () {
        var MAX_GUESTS = 10;
        var form = document.getElementById("guest-form");
        var guestsList = document.getElementById("guests-list");
        var addBtn = document.getElementById("add-guest");
        var countEl = document.getElementById("guest-count");
        var submitBtn = document.getElementById("submit-btn");
        var errorEl = document.getElementById("form-error");
        var successEl = document.getElementById("form-success");
        var template = document.getElementById("guest-row-template");

        function guestCount() {
          return guestsList.querySelectorAll("[data-guest]").length;
        }

        function refreshUI() {
          var n = guestCount();
          countEl.textContent = n + " / " + MAX_GUESTS;
          addBtn.disabled = n >= MAX_GUESTS;
          guestsList.querySelectorAll("[data-guest]").forEach(function (row, i) {
            row.querySelector("[data-guest-num]").textContent = String(i + 1);
            var removeBtn = row.querySelector("[data-remove]");
            removeBtn.disabled = n <= 1;
            removeBtn.hidden = n <= 1;
          });
        }

        function addGuest() {
          if (guestCount() >= MAX_GUESTS) return;
          var node = template.content.cloneNode(true);
          var row = node.querySelector("[data-guest]");
          row.querySelector("[data-remove]").addEventListener("click", function () {
            if (guestCount() <= 1) return;
            row.remove();
            refreshUI();
          });
          guestsList.appendChild(node);
          refreshUI();
        }

        function showError(msg) {
          successEl.hidden = true;
          errorEl.hidden = false;
          errorEl.textContent = msg;
        }

        function showSuccess(msg) {
          errorEl.hidden = true;
          successEl.hidden = false;
          successEl.textContent = msg;
        }

        function collectGuests() {
          return Array.prototype.map.call(guestsList.querySelectorAll("[data-guest]"), function (row) {
            return {
              name: row.querySelector("[data-guest-name]").value.trim(),
              nic: row.querySelector("[data-guest-nic]").value.trim().toUpperCase(),
            };
          });
        }

        function validate(studentIndex, guests) {
          if (!studentIndex) return "Enter student index number.";
          if (!guests.length) return "Add at least one outside guest.";
          for (var i = 0; i < guests.length; i++) {
            if (!guests[i].name) return "Enter a name for guest " + (i + 1) + ".";
            if (!guests[i].nic) return "Enter a NIC for guest " + (i + 1) + ".";
            if (guests[i].nic.length < 5) return "NIC for guest " + (i + 1) + " looks too short.";
          }
          var nics = guests.map(function (g) {
            return g.nic;
          });
          if (new Set(nics).size !== nics.length) return "Duplicate NIC numbers found.";
          return null;
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          errorEl.hidden = true;
          successEl.hidden = true;

          var studentIndex = document.getElementById("student-index").value.trim();
          var guests = collectGuests();
          var problem = validate(studentIndex, guests);
          if (problem) {
            showError(problem);
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = "Saving…";

          google.script.run
            .withSuccessHandler(function (result) {
              showSuccess(
                "Saved " +
                  guests.length +
                  " guest" +
                  (guests.length === 1 ? "" : "s") +
                  " for " +
                  studentIndex +
                  "."
              );
              form.reset();
              guestsList.innerHTML = "";
              addGuest();
              submitBtn.disabled = false;
              submitBtn.textContent = "Save guest list";
            })
            .withFailureHandler(function (err) {
              showError((err && err.message) || String(err) || "Save failed.");
              submitBtn.disabled = false;
              submitBtn.textContent = "Save guest list";
            })
            .saveGuests({ studentIndex: studentIndex, guests: guests });
        });

        addBtn.addEventListener("click", addGuest);
        addGuest();
      })();
    </script>
  </body>
</html>
